- insert:
    - id: super-bot
      name: '@zxdvd/super-bot'
      # Default: Bot query tools (including Shell) + native Full Access Worker. False: management-only Bot + files Worker.
      config:
        fullAccess: true
        # allowedRoots: [/absolute/path/projects]  # Task workdirs must resolve inside these roots.
        # defaultWorkdir: isolated  # isolated | worktree | hook | none; the Bot may choose per task.
        # workdirCleanup: manual    # manual | on-complete
        # workdirHook:              # Optional; any tool that prints SB_WORKDIR=<dir>, e.g. `tw ws create {name}`.
        #   create: my-tool create {name} {args.repos}
        #   argNames: [repos]
        # maxRunningTasks: 2        # Global Worker slots.
        # managerWakesPerHour: 20   # Per-Bot automatic wakes; hitting it records a visible problem.
